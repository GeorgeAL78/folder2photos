name: Update Docker Hub description

on:
  push:
    branches: [main]
    paths: [dockerhub/README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: gjergjk/folder2photos
          short-description: "Upload new photos and videos from a folder to Google Photos, once each, with a web UI"
          readme-filepath: ./dockerhub/README.md
